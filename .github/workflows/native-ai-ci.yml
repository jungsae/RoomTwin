# Host tests, Android builds, lint, and local Maven consumption for native-ai.
# This does not install Gemma weights and does not run a device.
# Unity Editor and Galaxy S20+ checks stay outside this workflow.
# The job uses Gradle 9.3.1 from the setup action when there is no wrapper.

name: native-ai

on:
  pull_request:
    paths:
      - "native-ai/**"
      - ".github/workflows/native-ai-ci.yml"
  push:
    branches:
      - main
    paths:
      - "native-ai/**"

permissions:
  contents: read

concurrency:
  group: native-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: App and Bridge build, test, lint, and Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-ai
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require the Gradle project
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "native-ai/settings.gradle.kts is not in this checkout."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify app and Bridge builds
        run: |
          gradle_command=gradle
          if [ -x ./gradlew ]; then
            gradle_command=./gradlew
          fi

          "$gradle_command" --stacktrace \
            :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            :bridge:testDebugUnitTest :bridge:assembleRelease :bridge:lintRelease

          "$gradle_command" --stacktrace :bridge:publishReleasePublicationToUnityRepository

          # Resolve the Bridge from the published Maven coordinates in a separate build.
          "$gradle_command" --stacktrace -PusePublishedBridge=true \
            :app:assembleDebug :app:assembleField

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ai-reports
          path: |
            native-ai/app/build/reports/tests/
            native-ai/app/build/reports/lint-results-debug.html
            native-ai/app/build/reports/lint-results-debug.xml
            native-ai/bridge/build/reports/tests/
            native-ai/bridge/build/test-results/testDebugUnitTest/TEST-*.xml
            native-ai/bridge/build/reports/lint-results-release.html
            native-ai/bridge/build/reports/lint-results-release.xml
          if-no-files-found: ignore
